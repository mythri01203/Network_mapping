function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const x=new T.CanvasTexture(c);x.wrapS=x.wrapT=T.RepeatWrapping;x.encoding=T.sRGBEncoding;x.anisotropy=8;if(rep)x.repeat.set(...rep);return x}
